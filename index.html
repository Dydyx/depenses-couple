<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff">
  <title>&#8203;</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d2433'/%3E%3Cpath d='M21 10.5a7 7 0 1 0 0 11M8.5 14.5h9M8.5 18h9' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="login" class="login">
    <form id="login-form" autocomplete="off">
      <input type="password" id="pwd" aria-label="Mot de passe" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      <button type="submit" class="btn primary">Valider</button>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <nav class="tabs" role="tablist" aria-label="Onglets">
        <button type="button" role="tab" class="tab" data-tab="dyd">Dépenses Dyd</button>
        <button type="button" role="tab" class="tab" data-tab="meg">Dépenses Meg</button>
        <button type="button" role="tab" class="tab" data-tab="couple">Dépenses du couple</button>
      </nav>
      <div class="top-right">
        <span class="sync" id="sync" data-state="local"><i aria-hidden="true"></i><span class="sync-text"></span></span>
        <button type="button" class="icon-btn" id="logout" aria-label="Se déconnecter" title="Se déconnecter">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </header>
    <main id="panels"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
